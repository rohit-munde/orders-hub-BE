spring.application.name=orders-hub
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:${SERVER_PORT:8080}}
server.address=0.0.0.0

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:${MYSQLHOST:localhost}}:${MYSQL_PORT:${MYSQLPORT:3307}}/${MYSQL_DATABASE:${MYSQLDATABASE:orders_hub}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:${MYSQLUSER:orders_hub_user}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:${MYSQLPASSWORD:orders_hub_dev_2026}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.initialization-fail-timeout=${HIKARI_INITIALIZATION_FAIL_TIMEOUT:60000}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:false}

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Google OAuth 2.0 server-side code exchange
google.oauth.client-id=${GOOGLE_WEB_CLIENT_ID}
google.oauth.client-secret=${GOOGLE_WEB_CLIENT_SECRET}
google.http.connect-timeout=${GOOGLE_HTTP_CONNECT_TIMEOUT:5s}
google.http.read-timeout=${GOOGLE_HTTP_READ_TIMEOUT:15s}

# Gmail order-email search. Gmail filters these rules server-side before IDs are returned.
ordershub.gmail.search.lookback-days=${GMAIL_SEARCH_LOOKBACK_DAYS:45}
ordershub.gmail.search.batch-size=${GMAIL_SEARCH_BATCH_SIZE:100}
ordershub.gmail.search.subject-keywords=order,ordered,shipped,delivered,dispatched,invoice,receipt,refund,refunded,return,returned
ordershub.gmail.search.sender-domains=amazon.in,flipkart.com,myntra.com,meesho.com,swiggy.in,zomato.com

# Application JWT and OAuth token encryption keys must be Base64-encoded.
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.ttl=${APP_JWT_TTL:PT24H}
security.token-encryption-key=${TOKEN_ENCRYPTION_KEY}

spring.flyway.enabled=false


## Gemini Key Details
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-3.7-flash
company.enrichment.placeholder-logo-url=/assets/default-company-logo.png
company.enrichment.min-logo-width=16
company.enrichment.min-logo-height=16
company.enrichment.min-confidence=0.85
