spring.application.name=orders-hub
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:false}

# Google OAuth 2.0 server-side code exchange
google.oauth.client-id=${GOOGLE_WEB_CLIENT_ID}
google.oauth.client-secret=${GOOGLE_WEB_CLIENT_SECRET}
google.http.connect-timeout=${GOOGLE_HTTP_CONNECT_TIMEOUT:5s}
google.http.read-timeout=${GOOGLE_HTTP_READ_TIMEOUT:15s}

# Gmail order-email search. Gmail filters these rules server-side before IDs are returned.
ordershub.gmail.search.newer-than=${GMAIL_SEARCH_NEWER_THAN:1y}
ordershub.gmail.search.batch-size=${GMAIL_SEARCH_BATCH_SIZE:25}
ordershub.gmail.search.subject-keywords=order,ordered,shipped,delivered,dispatched,invoice,receipt
ordershub.gmail.search.sender-domains=amazon.in,flipkart.com,myntra.com,meesho.com,swiggy.in,zomato.com

# Application JWT and OAuth token encryption keys must be Base64-encoded.
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.ttl=${APP_JWT_TTL:PT24H}
security.token-encryption-key=${TOKEN_ENCRYPTION_KEY}
